<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Stars Оплата</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;">
  <h1>Купить за 5 ⭐</h1>
  <button id="payBtn" style="padding:12px 24px;font-size:18px;border:none;border-radius:10px;background:#0088cc;color:white;">
    Оплатить
  </button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    document.getElementById("payBtn").addEventListener("click", async () => {
      const res = await fetch("/get_invoice", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ initData: tg.initData })
      });
      const data = await res.json();
      tg.openInvoice(data.payload);
    });
  </script>
</body>
</html>
